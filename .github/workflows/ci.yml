name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04
            compiler: clang
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf automake libtool libltdl-dev \
            libglib2.0-dev libgtk2.0-dev \
            libssl-dev \
            libxml2-dev \
            libenchant-2-dev \
            flex bison \
            gettext

      - name: Bootstrap autotools
        run: autoreconf -fiv

      - name: Configure (default + hardening)
        run: |
          ./configure \
            --enable-all-warnings \
            --enable-hardening

      - name: Build
        run: make -j$(nproc)

  sanitizers:
    name: ASan/UBSan (ubuntu-22.04, clang)
    runs-on: ubuntu-22.04

    env:
      CC: clang
      CXX: clang++
      # Make ASan/UBSan failures fatal
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: abort_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf automake libtool libltdl-dev \
            libglib2.0-dev libgtk2.0-dev \
            libssl-dev libxml2-dev \
            libenchant-2-dev \
            flex bison gettext

      - name: Bootstrap autotools
        run: autoreconf -fiv

      - name: Configure with sanitizers
        run: |
          ./configure \
            --enable-all-warnings \
            --enable-sanitizers

      - name: Build
        run: make -j$(nproc)

  test:
    name: Unit tests (meson, ubuntu-22.04, gcc)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            meson ninja-build \
            libglib2.0-dev libgtk2.0-dev \
            libssl-dev libxml2-dev \
            libenchant-2-dev \
            flex bison gettext \
            libtool libltdl-dev

      - name: Configure (meson)
        run: meson setup build

      - name: Run tests
        run: meson test -C build --print-errorlogs
